<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120" fill="none">
  <!--
    Comfort Textile brand ring motif — transparent overlay tile for dark
    surfaces. Same seamless geometry as rings.svg, drawn in the corporate
    cream #F9F5EC so it reads on navy / charcoal backgrounds.
  -->
  <g fill="none" stroke="#F9F5EC" stroke-opacity="0.07" stroke-width="11">
    <circle cx="0" cy="0" r="24"/>
    <circle cx="0" cy="60" r="24"/>
    <circle cx="0" cy="120" r="24"/>
    <circle cx="120" cy="0" r="24"/>
    <circle cx="120" cy="60" r="24"/>
    <circle cx="120" cy="120" r="24"/>
    <circle cx="60" cy="-30" r="24"/>
    <circle cx="60" cy="30" r="24"/>
    <circle cx="60" cy="90" r="24"/>
    <circle cx="60" cy="150" r="24"/>
  </g>
</svg>
