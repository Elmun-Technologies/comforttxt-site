<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 20 20" fill="none">
  <!-- Basketweave: alternating horizontal/vertical blocks, subtle brand blue -->
  <g fill="#283593" fill-opacity="0.045">
    <rect x="0" y="0" width="10" height="10"/>
    <rect x="10" y="10" width="10" height="10"/>
  </g>
  <g fill="none" stroke="#283593" stroke-opacity="0.05" stroke-width="0.5">
    <rect x="0.25" y="0.25" width="19.5" height="19.5"/>
  </g>
</svg>
